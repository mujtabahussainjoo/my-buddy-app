name: myaibuddy

# =============================================================================
# MyAIBuddy Docker Compose
# =============================================================================
# Quick start:
#   cp .env.example .env       # Configure once
#   docker compose up -d       # Start everything
#
# The app prints all URLs on startup. See Makefile for more commands.
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: myaibuddy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myaibuddy}
      POSTGRES_USER: ${POSTGRES_USER:-myaibuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myaibuddy_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myaibuddy} -d ${POSTGRES_DB:-myaibuddy}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --------------------------------------------------------------------------
  # Backend - FastAPI
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      target: backend
    container_name: myaibuddy-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MyAIBuddy}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:${FRONTEND_PORT:-8080}}
      API_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-myaibuddy}
      POSTGRES_USER: ${POSTGRES_USER:-myaibuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myaibuddy_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-keyword}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      CHUNK_SIZE: ${CHUNK_SIZE:-700}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-70}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      UPLOAD_DIR: var/uploads
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-30/minute}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-15/minute}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-myaibuddy}
      SENTRY_DSN: ${SENTRY_DSN:-}
      MCP_SERVER_URLS: ${MCP_SERVER_URLS:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/apps/backend/var/uploads
      - secrets_data:/app/apps/backend/var/secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # Frontend - Nginx serving React SPA
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      target: frontend
    container_name: myaibuddy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
  secrets_data:
